<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Камера</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        .camera-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        .camera {
            position: relative;
            height: 65%;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-block {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-block img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .object-info {
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            padding: 16px 20px;
            overflow-y: auto;
        }

        .object-info h2 {
            margin: 0 0 12px;
            font-size: 18px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .object-info h2 .badge {
            font-size: 12px;
            font-weight: normal;
            padding: 2px 10px;
            border-radius: 12px;
            background: #eaf4ff;
            color: #2c6fbb;
        }

        .object-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px 20px;
        }

        .object-field {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 0;
            border-bottom: 1px dashed #e6e6e6;
        }

        .object-field .label {
            font-size: 12px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .object-field .value {
            font-size: 15px;
            color: #2c3e50;
            font-weight: 500;
            word-break: break-word;
        }

        .object-field .value.status-known {
            color: #27ae60;
        }

        .object-field .value.status-unknown {
            color: #e74c3c;
        }

        .sidebar {
            width: 350px;
            display: flex;
            flex-direction: column;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fafafa;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            background: #2c3e50;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header1 {
            padding: 12px 16px;
            background: #2c3e50;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header .count {
            background: #3498db;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 13px;
        }

        .faces-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .faces-list1 {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .face-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .face-item:hover {
            background: #f0f7ff;
        }

        .face-item.unknown {
            border-left: 4px solid #e74c3c;
        }

        .face-item.known {
            border-left: 4px solid #27ae60;
        }

        .face-item.fresh {
            box-shadow: 0 0 0 2px #27ae60 inset;
        }

        .face-item.selected {
            background: #eaf4ff;
            box-shadow: 0 0 0 1px #3498db inset;
        }

        .face-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #3498db;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }

        .face-info {
            flex: 1;
            min-width: 0;
        }

        .face-name {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .face-meta {
            font-size: 12px;
            color: #7f8c8d;
        }

        .face-meta a {
            color: #2c6fbb;
            text-decoration: none;
        }

        .face-confidence {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 4px;
        }

        .confidence-high {
            background: #d4edda;
            color: #155724;
        }

        .confidence-medium {
            background: #fff3cd;
            color: #856404;
        }

        .confidence-low {
            background: #f8d7da;
            color: #721c24;
        }

        .empty-state {
            text-align: center;
            color: #95a5a6;
            padding: 40px 20px;
            font-size: 14px;
        }

        .empty-state1 {
            text-align: center;
            color: #95a5a6;
            padding: 40px 20px;
            font-size: 14px;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .empty-state1 .icon {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-dot.online {
            background: #27ae60;
        }

        .status-dot.offline {
            background: #e74c3c;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Левая колонка -->
        <div class="camera-column">
            <div class="camera">
                <div class="video-block">
                    <img id="video" alt="Видеопоток">
                </div>
            </div>

            <div class="object-info" id="objectInfo">
                <h2>
                    Информация об объекте
                    <span class="badge" id="objectStatusBadge">—</span>
                </h2>
                <div class="object-grid">
                    <div class="object-field">
                        <span class="label">Идентификация</span>
                        <span class="value" id="objName">—</span>
                    </div>
                    <div class="object-field">
                        <span class="label">Пол</span>
                        <span class="value" id="objGender">—</span>
                    </div>
                    <div class="object-field">
                        <span class="label">Возраст (оценка)</span>
                        <span class="value" id="objAge">—</span>
                    </div>
                    <div class="object-field">
                        <span class="label">Уверенность детектора</span>
                        <span class="value" id="objConfidence">—</span>
                    </div>
                    <div class="object-field">
                        <span class="label">Фото</span>
                        <span class="value" id="objPhoto">—</span>
                    </div>
                    <div class="object-field">
                        <span class="label">Время обнаружения</span>
                        <span class="value" id="objTime">—</span>
                    </div>
                    <div class="object-field">
                        <span class="label">Telegram</span>
                        <span class="value" id="objTelegram">—</span>
                    </div>
                    <div class="object-field">
                        <span class="label">Телефон</span>
                        <span class="value" id="objPhone">—</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Правая колонка -->
        <aside class="sidebar">
            <div class="sidebar-section sidebar-top">
                <div class="sidebar-header">
                    <span>
                        <span class="status-dot offline" id="wsStatus"></span>
                        Объекты в кадре
                    </span>
                    <span class="count" id="faceCount">0</span>
                </div>
                <div class="faces-list" id="facesList">
                    <div class="empty-state" id="emptyState">
                        <div class="icon">👤</div>
                        <div>Лица пока не обнаружены</div>
                    </div>
                </div>
            </div>
            <div class="sidebar-section sidebar-bottom">
                <div class="sidebar-header">
                    <span>
                        <span class="status-dot offline" id="wsStatus1"></span>
                        Распознанные лица
                    </span>
                    <span class="count" id="faceCount1">0</span>
                </div>
                <div class="faces-list" id="facesList1">
                    <div class="empty-state" id="emptyState1">
                        <div class="icon">👤</div>
                        <div>Лица пока не обнаружены</div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const els = {
            img: document.getElementById('video'),
            facesList: document.getElementById('facesList'),
            faceCount: document.getElementById('faceCount'),
            wsStatus: document.getElementById('wsStatus'),
            objName: document.getElementById('objName'),
            objGender: document.getElementById('objGender'),
            objAge: document.getElementById('objAge'),
            objConfidence: document.getElementById('objConfidence'),
            objPhoto: document.getElementById('objPhoto'),
            objTime: document.getElementById('objTime'),
            objTelegram: document.getElementById('objTelegram'),
            objPhone: document.getElementById('objPhone'),
            objBadge: document.getElementById('objectStatusBadge'),
            facesList1: document.getElementById('facesList1'),
            faceCount1: document.getElementById('faceCount1'),
            wsStatus1: document.getElementById('wsStatus1'),
        };

        let ws = null;
        let reconnectTimer = null;

        // Выбранный объект: стабильный ключ + сохранённые данные
        let selectedKey = null;      // строка-ключ: "id:123" или "bbox:10,20,30,40"
        let selectedFace = null;
        let selectedIsKnown = false;

        // Кэш последних отрисованных данных, чтобы не перерисовывать зря
        let lastFacesKey = '';
        let lastKnownKey = '';

        function connect() {
            ws = new WebSocket('ws://localhost:8765');

            ws.onopen = () => {
                console.log('WS подключён');
                [els.wsStatus, els.wsStatus1].forEach(el => {
                    el.classList.remove('offline');
                    el.classList.add('online');
                });
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
            };

            ws.onclose = () => {
                console.warn('WS отключён, переподключение через 2с');
                [els.wsStatus, els.wsStatus1].forEach(el => {
                    el.classList.remove('online');
                    el.classList.add('offline');
                });
                if (!reconnectTimer) {
                    reconnectTimer = setTimeout(connect, 2000);
                }
            };

            ws.onerror = (e) => console.error('WS ошибка:', e);

            ws.onmessage = (event) => {
                let msg;
                try { msg = JSON.parse(event.data); }
                catch (e) { console.warn('Не JSON:', event.data); return; }

                if (msg.type === 'frame') {
                    handleFrame(msg);
                } else if (msg.type === 'error') {
                    console.error('Сервер:', msg.msg);
                }
            };
        }

        // Стабильный ключ для лица
        function faceKey(f, isKnown) {
            if (isKnown && f.id != null) return 'id:' + f.id;
            // для неизвестных — округляем bbox до 20px, чтобы сгладить дрожание детектора
            if (f.bbox) {
                const b = f.bbox.map(v => Math.round(v / 20) * 20);
                return 'bbox:' + b.join(',');
            }
            return 'anon:' + Math.random();
        }

        function handleFrame(msg) {
            if (msg.image) els.img.src = msg.image;

            const known = msg.faces_known || [];
            const unknown = msg.faces_unknown || [];
            const knownAll = msg.faces_known_all || [];

            // --- Верхний список: лица в кадре ---
            const facesKey = JSON.stringify([
                known.map(f => faceKey(f, true)),
                unknown.map(f => faceKey(f, false)),
            ]);
            if (facesKey !== lastFacesKey) {
                lastFacesKey = facesKey;
                renderFacesList(known, unknown);
            }

            // --- Нижний список: накопленные ---
            const knownKey = JSON.stringify(knownAll.map(f => faceKey(f, true)));
            if (knownKey !== lastKnownKey) {
                lastKnownKey = knownKey;
                renderKnownFacesList(knownAll);
            }

            // --- Обновление выбранного объекта ---
            if (selectedKey) {
                // ищем по стабильному ключу
                let found = null, isKnown = false;
                for (const f of known) {
                    if (faceKey(f, true) === selectedKey) { found = f; isKnown = true; break; }
                }
                if (!found) {
                    for (const f of unknown) {
                        if (faceKey(f, false) === selectedKey) { found = f; isKnown = false; break; }
                    }
                }
                if (!found) {
                    for (const f of knownAll) {
                        if (faceKey(f, true) === selectedKey) { found = f; isKnown = true; break; }
                    }
                }
                if (found) {
                    selectedFace = found;
                    selectedIsKnown = isKnown;
                    renderObjectInfoFromFace(found, isKnown);
                }
                // если не найден — оставляем последние данные в панели
            } else {
                // ничего не выбрано — показываем основное лицо
                renderObjectInfo(known, unknown);
            }
        }

        function renderFacesList(known, unknown) {
            const total = known.length + unknown.length;
            els.faceCount.textContent = total;

            if (total === 0) {
                els.facesList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">👤</div>
                        <div>Лица пока не обнаружены</div>
                    </div>`;
                return;
            }

            const html = [
                ...known.map(f => renderFaceItem(f, true)),
                ...unknown.map(f => renderFaceItem(f, false)),
            ].join('');
            els.facesList.innerHTML = html;

            // Восстанавливаем выделение
            restoreSelection(els.facesList, known, unknown);
        }

        function renderKnownFacesList(items) {
            els.faceCount1.textContent = items.length;
            if (!items.length) {
                els.facesList1.innerHTML = `
                    <div class="empty-state1">
                        <div class="icon">👤</div>
                        <div>Распознанные лица появятся здесь</div>
                    </div>`;
                return;
            }
            els.facesList1.innerHTML = items.map(f => renderFaceItem(f, true)).join('');

            // Восстанавливаем выделение
            restoreSelection(els.facesList1, items, []);
        }

        function restoreSelection(container, known, unknown) {
            if (!selectedKey) return;
            const items = container.querySelectorAll('.face-item');
            let idx = 0;
            for (const f of known) {
                if (faceKey(f, true) === selectedKey) {
                    items[idx]?.classList.add('selected');
                    return;
                }
                idx++;
            }
            for (const f of unknown) {
                if (faceKey(f, false) === selectedKey) {
                    items[idx]?.classList.add('selected');
                    return;
                }
                idx++;
            }
        }

        // --- Делегирование событий: один обработчик на контейнер ---
        function handleListClick(e, known, unknown) {
            const item = e.target.closest('.face-item');
            if (!item) return;

            const items = Array.from(item.parentElement.querySelectorAll('.face-item'));
            const index = items.indexOf(item);

            let face, isKnown;
            if (index < known.length) {
                face = known[index];
                isKnown = true;
            } else {
                face = unknown[index - known.length];
                isKnown = false;
            }
            if (!face) return;

            // Снимаем выделение со всех в обоих списках
            document.querySelectorAll('.face-item.selected').forEach(el => el.classList.remove('selected'));
            item.classList.add('selected');

            selectedKey = faceKey(face, isKnown);
            selectedFace = face;
            selectedIsKnown = isKnown;

            renderObjectInfoFromFace(face, isKnown);
        }

        // Навешиваем делегирование один раз — при загрузке
        els.facesList.addEventListener('click', (e) => {
            // берём актуальные данные из последнего кадра
            const data = lastFrameData;
            if (!data) return;
            handleListClick(e, data.known, data.unknown);
        });
        els.facesList1.addEventListener('click', (e) => {
            const data = lastFrameData;
            if (!data) return;
            handleListClick(e, data.knownAll, []);
        });

        // Храним последние данные кадра для обработчиков клика
        let lastFrameData = null;

        // Переопределяем handleFrame, чтобы сохранять данные
        const _origHandleFrame = handleFrame;
        handleFrame = function (msg) {
            lastFrameData = {
                known: msg.faces_known || [],
                unknown: msg.faces_unknown || [],
                knownAll: msg.faces_known_all || [],
            };
            _origHandleFrame(msg);
        };

        function renderObjectInfoFromFace(face, isKnown) {
            if (isKnown) {
                const name = [face.last_name, face.first_name].filter(Boolean).join(' ') || '—';
                setObjField('objName', name);
                els.objName.className = 'value status-known';
                els.objBadge.textContent = 'опознан';

                if (face.photo) {
                    els.objPhoto.innerHTML =
                        `<img src="${face.photo}" alt="фото" style="max-height:80px;border-radius:4px;">`;
                } else {
                    els.objPhoto.textContent = '—';
                }

                if (face.telegram_link) {
                    els.objTelegram.innerHTML =
                        `<a href="${face.telegram_link}" target="_blank" rel="noopener">${face.telegram_link}</a>`;
                } else if (face.username) {
                    els.objTelegram.innerHTML =
                        `<a href="https://t.me/${face.username}" target="_blank" rel="noopener">@${face.username}</a>`;
                } else {
                    els.objTelegram.textContent = '—';
                }

                setObjField('objPhone', face.phone_number || '—');
            } else {
                setObjField('objName', 'Неизвестный');
                els.objName.className = 'value status-unknown';
                els.objBadge.textContent = 'не опознан';
                setObjField('objPhoto', '—');
                setObjField('objTelegram', '—');
                setObjField('objPhone', '—');
            }

            setObjField('objGender', face.gender);
            setObjField('objAge', face.age);
            setObjField('objConfidence', (face.score * 100).toFixed(1) + '%');
            setObjField('objTime', face.lastSeen ? formatTime(face.lastSeen) : new Date().toLocaleTimeString());
        }

        function formatTime(ms) {
            if (!ms) return '—';
            const d = new Date(ms);
            return d.toLocaleTimeString('ru-RU', { hour12: false });
        }

        function formatAgo(ms) {
            if (!ms) return '';
            const sec = Math.max(0, Math.round((Date.now() - ms) / 1000));
            if (sec < 60) return `${sec} с назад`;
            const min = Math.round(sec / 60);
            return `${min} мин назад`;
        }

        function renderFaceItem(f, isKnown) {
            const confidenceClass =
                f.score > 0.7 ? 'confidence-high' :
                    f.score > 0.5 ? 'confidence-medium' : 'confidence-low';

            const isFresh = isKnown && f.lastSeen && (Date.now() - f.lastSeen < 3000);
            const freshClass = isFresh ? ' fresh' : '';

            let avatarStyle = '';
            let avatarContent = f.gender;
            if (isKnown && f.photo) {
                avatarStyle = `background-image:url('${f.photo}'); color:transparent;`;
                avatarContent = '';
            }

            let title;
            if (isKnown) {
                const name = [f.last_name, f.first_name].filter(Boolean).join(' ') || 'Без имени';
                title = `${name} (${f.gender}, ${f.age})`;
            } else {
                title = `Неизвестный (${f.gender}, ${f.age})`;
            }

            let meta = '';
            if (isKnown) {
                if (f.username) meta += `@${f.username} `;
                if (f.phone_number) meta += `· ${f.phone_number} `;
                const t = formatTime(f.lastSeen);
                meta += `<br>Обнаружен: ${t}`;
            } else {
                meta = `bbox: ${f.bbox.join(', ')}`;
            }

            return `
                <div class="face-item ${isKnown ? 'known' : 'unknown'}${freshClass}">
                    <div class="face-avatar" style="${avatarStyle}">${avatarContent}</div>
                    <div class="face-info">
                        <div class="face-name">${escapeHtml(title)}</div>
                        <div class="face-meta">${meta}</div>
                        <span class="face-confidence ${confidenceClass}">
                            ${(f.score * 100).toFixed(1)}%
                        </span>
                    </div>
                </div>`;
        }

        function renderObjectInfo(known, unknown) {
            const pool = known.length ? known : unknown;
            if (!pool.length) {
                setObjField('objName', '—');
                setObjField('objGender', '—');
                setObjField('objAge', '—');
                setObjField('objConfidence', '—');
                setObjField('objPhoto', '—');
                setObjField('objTime', '—');
                setObjField('objTelegram', '—');
                setObjField('objPhone', '—');
                els.objBadge.textContent = '—';
                els.objName.className = 'value';
                return;
            }

            const main = pool.slice().sort((a, b) => b.score - a.score)[0];
            const isKnown = known.includes(main);
            renderObjectInfoFromFace(main, isKnown);
        }

        function setObjField(id, value) {
            els[id].textContent = value;
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        connect();
    </script>
</body>

</html>
